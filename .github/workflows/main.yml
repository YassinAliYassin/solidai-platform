name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Pages write is granted only on the build and deploy jobs. Test jobs stay read-only.
permissions:
  contents: read

# One group per ref so a pull request cannot cancel an in-progress Pages deploy.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Root lint and build run on every pull request and every push. Package jobs
  # below run only when their paths (or this workflow) change.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # The Pages artifact is only produced for a real main deploy. Pull
      # requests still lint and build, then skip this step.
      - name: Upload artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  changes:
    runs-on: ubuntu-latest
    outputs:
      config_service: ${{ steps.filter.outputs.config_service }}
      web_ui: ${{ steps.filter.outputs.web_ui }}
      cloud_frontend: ${{ steps.filter.outputs.cloud_frontend }}
      health_monitor: ${{ steps.filter.outputs.health_monitor }}
      sre_agent: ${{ steps.filter.outputs.sre_agent }}
      cloud_backend: ${{ steps.filter.outputs.cloud_backend }}
      gateway: ${{ steps.filter.outputs.gateway }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          mark_all() {
            for key in config_service web_ui cloud_frontend health_monitor sre_agent cloud_backend gateway; do
              echo "${key}=true" >> "$GITHUB_OUTPUT"
            done
          }
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            mark_all
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi
          if [ -z "${base}" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            mark_all
            exit 0
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$base"
          fi
          files="$(git diff --name-only "$base" HEAD)"
          echo "Changed files:"
          printf '%s\n' "$files"
          emit() {
            key="$1"
            pattern="$2"
            if printf '%s\n' "$files" | grep -Eq "$pattern|^\.github/workflows/main\.yml$"; then
              echo "${key}=true" >> "$GITHUB_OUTPUT"
            else
              echo "${key}=false" >> "$GITHUB_OUTPUT"
            fi
          }
          emit config_service '^packages/sre/config_service/'
          emit web_ui '^packages/sre/web_ui/'
          emit cloud_frontend '^packages/cloud/frontend/'
          emit health_monitor '^packages/sre/health-monitor/'
          emit sre_agent '^packages/sre/sre-agent/'
          emit cloud_backend '^packages/cloud/(backend/|mcp_auth\.py$|mcp_server\.py$)'
          emit gateway '^packages/gateway/'

  test-config-service:
    needs: changes
    if: needs.changes.outputs.config_service == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install config_service test deps
        working-directory: packages/sre/config_service
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install pytest pyjwt cryptography python-multipart \
            croniter httpx ruamel.yaml prometheus_client sqlalchemy \
            structlog watchdog fastapi pydantic pydantic-settings email-validator \
            alembic psycopg2-binary

      - name: Run config_service tests
        working-directory: packages/sre/config_service
        env:
          ENCRYPTION_KEY: ${{ secrets.CONFIG_SERVICE_ENCRYPTION_KEY }}
        run: |
          . .venv/bin/activate
          pytest -q

  lint-web-ui:
    needs: changes
    if: needs.changes.outputs.web_ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/sre/web_ui/package-lock.json

      - name: Install dependencies
        working-directory: packages/sre/web_ui
        run: npm ci

      - name: Typecheck
        working-directory: packages/sre/web_ui
        run: npx tsc --noEmit

      - name: Lint
        working-directory: packages/sre/web_ui
        run: npm run lint

  lint-cloud-frontend:
    needs: changes
    if: needs.changes.outputs.cloud_frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/cloud/frontend/package-lock.json

      - name: Install dependencies
        working-directory: packages/cloud/frontend
        run: npm ci

      - name: Typecheck
        working-directory: packages/cloud/frontend
        run: npx tsc -b

      - name: Lint
        working-directory: packages/cloud/frontend
        run: npm run lint

  test-health-monitor:
    needs: changes
    if: needs.changes.outputs.health_monitor == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test deps
        working-directory: packages/sre/health-monitor
        run: pip install pytest pytest-asyncio fastapi httpx uvicorn

      - name: Run health-monitor tests
        working-directory: packages/sre/health-monitor
        run: pytest -q

  test-sre-agent:
    needs: changes
    if: needs.changes.outputs.sre_agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Sync dependencies
        working-directory: packages/sre/sre-agent
        run: uv sync --all-extras --dev

      - name: Run sre-agent tests
        working-directory: packages/sre/sre-agent
        run: uv run --with pytest python -m pytest -q

  test-cloud-backend:
    needs: changes
    if: needs.changes.outputs.cloud_backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: packages/cloud/backend
        run: pip install -r requirements.txt

      - name: Run cloud backend tests
        working-directory: packages/cloud/backend
        run: python -m unittest discover -s tests -v

  test-gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/gateway/package-lock.json

      - name: Install dependencies
        working-directory: packages/gateway
        run: npm ci

      # node --test only. Do not npm start; that boots Telegram and WhatsApp clients.
      - name: Run gateway tests
        working-directory: packages/gateway
        run: npm test
